directory: ~/library/audio/music
library: ~/library/audio/.beet.blb
import:
    move: yes
ui:
    color: yes
plugins: musicbrainz lyrics lastgenre mbsync fetchart scrub bpd chroma convert badfiles missing
lastgenre:
    count: 3
    force: yes
chroma:
    auto: yes
convert:
    dest: ~/sync/pixel/audio/music
    format: mp3
    copy_album_art: yes
    embed: yes
